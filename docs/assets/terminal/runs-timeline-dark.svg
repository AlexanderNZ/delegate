<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 320" width="968" height="320" role="img" aria-labelledby="runs-timeline-title runs-timeline-desc" font-family="'Noto Sans Mono', ui-monospace, monospace" font-size="13" xml:space="preserve">
  <title id="runs-timeline-title">delegate runs --timeline: one lane for each run (frame W9)</title>
  <desc id="runs-timeline-desc">The same runs as the table, with time across. The lane all shows the tickets that ended in each cell of the last 6 hours, the column of now, and the projection to the latest ETA. Each other lane shows the life of one run, a mark where each ticket ended, the end of a run that ended, and the projection of a run that runs. The footer gives the command to see a run in detail.</desc>

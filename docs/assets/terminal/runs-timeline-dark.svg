    .bg { fill: #24211f; }
    .fg { fill: #e0deda; }
    .dim { fill: #96918c; }
    .plan { fill: #85b4f0; }
    .ok { fill: #88c28a; }
    .now { fill: #59c2d4; }
    .warn { fill: #ceac64; }
    .bad { fill: #ea9891; }
  </style>
  <rect class="bg" x="0" y="0" width="968" height="320" rx="4"/>

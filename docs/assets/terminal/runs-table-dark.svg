  <text y="335"></text>
  <text y="353"><tspan x="16" class="fg">watch       delegate watch &lt;run&gt;</tspan></text>
  <text y="371"><tspan x="16" class="fg">resume      delegate run --resume &lt;run&gt;</tspan></text>
  <text y="389"><tspan x="16" class="fg">retry       delegate run --resume &lt;run&gt; --retry &lt;ticket&gt;</tspan></text>
  <text y="407"><tspan x="16" class="fg">merge       git merge --ff-only &lt;run branch&gt;</tspan></text>
  <text y="425"><tspan x="16" class="fg">check host  ssh &lt;host&gt;; on another host, put ssh &lt;host&gt; in front of each command</tspan></text>

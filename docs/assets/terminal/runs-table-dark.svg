<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 446" width="968" height="446" role="img" aria-labelledby="runs-table-title runs-table-desc" font-family="'Noto Sans Mono', ui-monospace, monospace" font-size="13" xml:space="preserve">
  <title id="runs-table-title">delegate runs: the runs of two hosts and of three repositories (frame W8)</title>
  <desc id="runs-table-desc">The header line, the two fleet lines and the table of the runs of two hosts. The first row of the host laptop holds the totals of its three runs that have not ended. The run of web has a fix-up round, the run of api has an agent that is idle for 6m40s, and the run of docs is paused, so each has its word in the column do. The host ci-runner is unreachable: its row says that its last answer came 47 minutes ago, and under it are the reason and its last-known run. The group ended holds two runs of laptop that ended, one built and one failed. The legend gives the command of each word of the column do.</desc>
  <style>
    .bg { fill: #24211f; }
    .fg { fill: #e0deda; }
    .dim { fill: #96918c; }
    .plan { fill: #85b4f0; }
    .ok { fill: #88c28a; }
    .now { fill: #59c2d4; }
    .warn { fill: #ceac64; }
    .bad { fill: #ea9891; }
  </style>
  <rect class="bg" x="0" y="0" width="968" height="446" rx="4"/>
  <text y="29"><tspan x="16" class="dim">config /home/me/.config/delegate/config.toml · the index of this machine only · hosts ci-runner</tspan></text>
  <text y="47"><tspan x="16" class="fg">runs  3 of 4 reachable  </tspan><tspan x="203.2" class="ok">███████</tspan><tspan x="257.8" class="dim">░░░░░░░░░</tspan><tspan x="328" class="fg"> 47%  11/23 ended  ETA 16:32 · 1 with no ETA  </tspan><tspan x="686.8" class="dim">570k new · 6.6M cache</tspan></text>

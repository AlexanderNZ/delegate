# The configuration of the docs site. Build it with the command in CONTRIBUTING.md.
# The version of Zensical is in `.zensical-version`, and nowhere else.

[project]
site_name = "delegate"
site_description = "A delegation kit: a coordinator, a specialist and a blind verifier, with a workflow engine that builds tickets through a coding-agent harness."
# The GitHub Pages address. The sitemap and the canonical link of each page use it.
site_url = "https://alexandernz.github.io/delegate/"
repo_url = "https://github.com/AlexanderNZ/delegate"
repo_name = "AlexanderNZ/delegate"
docs_dir = "docs"
site_dir = "site"
# The theme: design/README.md is the spec, design/delegate-docs-theme-2c.dc.html the prototype.
extra_css = ["stylesheets/delegate.css"]
extra_javascript = ["javascripts/glossary.js", "javascripts/delegate.js"]

# The sections follow the Diataxis split. "Start here" (the overview) comes
# first, and "Glossary" comes last.
nav = [
  { "Start here" = "overview.md" },
  { "Tutorial" = "tutorial.md" },
  { "How-to guides" = [
    { "Bootstrap a single-stack repository" = "how-to/bootstrap-a-single-stack-repository.md" },
    { "Bootstrap a monorepo" = "how-to/bootstrap-a-monorepo.md" },
    { "Run an economy chain" = "how-to/run-an-economy-chain.md" },
    { "Watch and resume a run" = "how-to/watch-and-resume-a-run.md" },
    { "Point the tiers at a gateway" = "how-to/point-the-tiers-at-a-gateway.md" },
    { "Add a harness adapter" = "how-to/add-a-harness-adapter.md" },
    { "Use the kit after to-spec and to-tickets" = "how-to/use-the-kit-after-to-spec-and-to-tickets.md" },
  ] },
  { "Explanation" = [
    { "Why the model should not matter" = "explanation/why-the-model-should-not-matter.md" },
    { "Why the verifier is blind" = "explanation/why-the-verifier-is-blind.md" },
    { "Why each specialist has its own verifier" = "explanation/why-each-specialist-has-its-own-verifier.md" },
    { "The mode trade-off" = "explanation/the-mode-trade-off.md" },
    { "Prior art" = "explanation/prior-art.md" },
    { "The enforcement model and its limits" = "explanation/the-enforcement-model-and-its-limits.md" },
    { "Why the code has this shape" = "explanation/why-the-code-has-this-shape.md" },
    { "The decision records" = "explanation/decision-records.md" },
  ] },
  { "Reference" = [
    { "The workflow file" = "reference/workflow.md" },
    { "delegate run" = "reference/run.md" },
    { "delegate status and delegate watch" = "reference/status-and-watch.md" },
    { "The commands" = "reference/commands.md" },
    { "delegate docs" = "reference/docs.md" },
    { "The claude-code adapter" = "reference/claude-code-adapter.md" },
    { "The opencode adapter" = "reference/opencode-adapter.md" },
    { "The layout of the repository" = "reference/layout.md" },
  ] },
  { "Future ideas" = "future-ideas.md" },
  { "Glossary" = "glossary.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
custom_dir = "overrides"
font.text = "Noto Serif"
font.code = "Noto Sans Mono"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
toc.permalink = "¶"
pymdownx.highlight.anchor_linenums = true
# The theme reads the language from this class for the label of a code block.
pymdownx.highlight.pygments_lang_class = true
# A diagram is a Mermaid block or an SVG, never a drawing in a code block (see CONTRIBUTING).
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
# The glossary tooltips: `delegate docs` writes this file, outside docs/, from docs/glossary.md.
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]

# docs/agents/ holds the rules for agents. docs/adr/ holds the ADRs, which link to the tests and the source
# with paths that leave docs/. The page "The decision records" is the index of the ADRs on the site.
[project.plugins.exclude]
glob = ["agents/**", "adr/**"]

# The site has no index page, so the root opens the overview.
[project.plugins.redirects.redirect_maps]
"index.md" = "overview.md"
# The old address of the page "Why each specialist has its own verifier", which had the title "Why each specialist has a verifier twin".
"explanation/why-each-specialist-has-a-twin.md" = "explanation/why-each-specialist-has-its-own-verifier.md"

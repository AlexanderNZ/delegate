[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-definitions"
version = "1.0.0"
description = "Render specialist-verifier agent pairs for Claude Code and OpenCode from one declaration, validate rendered agent files, and build verifier briefs."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
delegate = "delegate.delegate:main"
agent-definitions = "delegate.cli:main"
verifier-brief = "delegate.brief:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["delegate", "delegate.definitions", "delegate.ports"]

[tool.setuptools.package-data]
delegate = ["tiers.toml", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

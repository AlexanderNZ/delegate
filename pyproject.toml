[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-definitions"
version = "1.0.0"
description = "Render specialist-verifier agent pairs for Claude Code and OpenCode from one declaration, validate rendered agent files, and build verifier briefs."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
delegate = "delegate.cli.delegate:main"
agent-definitions = "delegate.cli.agent_definitions:main"
verifier-brief = "delegate.cli.brief:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["delegate", "delegate.adapters", "delegate.cli", "delegate.definitions", "delegate.docs", "delegate.ports", "delegate.run", "delegate.shared"]

[tool.setuptools.package-data]
"delegate.definitions" = ["templates/*.md"]
"delegate.shared" = ["tiers.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
